name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend and Electron
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 后端集成测试会用 node --experimental-strip-types 启动前端支持脚本
      # （依赖 src/ 的 TS 模块与 react-dom），需要 Node 22 与 node_modules。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-purra.txt
            backend/requirements-runtime.txt
      - run: npm ci
      - run: python -m pip install -r backend/requirements.txt
      - name: Verify external PurrA dependency
        run: |
          python -m pip check
          python -m pytest backend/tests/test_purra_package.py -q
      - run: python -m pytest backend/tests

  windows-backend-package:
    name: Windows backend package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-purra.txt
            backend/requirements-runtime.txt
      - name: Build frozen backend
        run: |
          python -m pip install -r backend/requirements.txt pyinstaller
          python -m PyInstaller --clean --noconfirm --distpath backend/dist --workpath backend/build backend/purrtypos-backend.spec
      - name: Verify frozen backend
        shell: pwsh
        run: |
          $env:PURRTYPOS_DATA_DIR = Join-Path $env:RUNNER_TEMP "purrtypos-data"
          $process = Start-Process -FilePath "backend/dist/purrtypos-backend/purrtypos-backend.exe" -ArgumentList "8765" -PassThru
          try {
            $health = $null
            foreach ($attempt in 1..60) {
              if ($process.HasExited) {
                throw "Frozen backend exited before becoming healthy with code $($process.ExitCode)"
              }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8765/health" -TimeoutSec 2
                break
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if ($null -eq $health -or $health.status -ne "ok") {
              throw "Frozen backend did not become healthy"
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }
