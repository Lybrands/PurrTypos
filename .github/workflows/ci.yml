name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend and Electron
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pip install --no-deps --no-build-isolation -e packages/purra
      - name: Build PurrA distributions
        run: |
          python -m pip install build
          python -m build packages/purra --sdist --wheel --outdir packages/purra/dist
      - name: Verify installed PurrA distribution
        run: |
          python -m venv "$RUNNER_TEMP/purra-smoke"
          "$RUNNER_TEMP/purra-smoke/bin/python" -m pip install --no-deps packages/purra/dist/*.whl
          "$RUNNER_TEMP/purra-smoke/bin/python" packages/purra/tests/installed_distribution_smoke.py
      - name: Install the built wheel for host tests
        run: |
          python -m pip install --force-reinstall --no-deps packages/purra/dist/*.whl
          python -c 'import pathlib, purra; assert "packages/purra/src" not in pathlib.Path(purra.__file__).as_posix()'
      - run: python -m pytest backend/tests packages/purra/tests
